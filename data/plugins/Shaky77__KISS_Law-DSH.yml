url: https://github.com/Shaky77/KISS_Law-DSH
name: Shaky77/KISS_Law-DSH
category: security
description:
  en: "English edition of Weiwen's Law (KISS's Law): a domain-agnostic white-box causal adjudication middleware for DeepSeek Harness. Every tool call is adjudicated before execution along a deterministic causal logic chain (R->S->D->H->M) - blocks destructive and credential-file operations, escalates repeated boundary violations, cuts faulting links until verified-fixed, and gives risk verdicts on un-auditable execution; runs fully local with zero API cost."
  zh: "唯稳律（KISS's Law）英文版：面向 DeepSeek Harness 的领域无关白箱因果裁决中间件。每个工具调用执行前沿确定性因果逻辑链（R->S->D->H->M）裁决 - 拦截破坏性与凭据文件操作、对反复越界升级止损、故障环节切断至修复验证、不可审计执行给出风险判定；纯本地运行、零 API 成本。"
